<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartKey-Jev // Desktop Instant Intent Dispatcher</title>
    
    <!-- Google Fonts: Poppins (Exact from 25) + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
    
    <!-- Real QR Code Library for Mobile Relay -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

    <style>
        /* Exact Core Styles from 25_Gratitude Garden */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #F3F0FA; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .preserve-3d {
            transform-style: preserve-3d;
        }
        
        /* The Signature 3D Isometric Platform from 25 */
        .iso-platform {
            transform: rotateX(60deg) rotateZ(-45deg);
            background-color: #B4A5FA;
            border-radius: 36px;
            box-shadow: 
                -1px 1px 0 #9E8EE3,
                -2px 2px 0 #9E8EE3,
                -3px 3px 0 #9E8EE3,
                -4px 4px 0 #9E8EE3,
                -5px 5px 0 #9E8EE3,
                -6px 6px 0 #9E8EE3,
                -7px 7px 0 #9E8EE3,
                -8px 8px 0 #9E8EE3,
                -15px 25px 40px rgba(158, 142, 227, 0.4);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Upright Projection for 3D elements */
        .iso-upright {
            transform: rotateZ(45deg) rotateX(-60deg);
            transform-origin: center bottom;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes float-platform {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .animate-float-platform {
            animation: float-platform 6s ease-in-out infinite;
        }

        /* Pulsing Rings from 25 */
        @keyframes ring-pulse {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(3.2); opacity: 0; }
        }
        .animate-ring-1 { animation: ring-pulse 2.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }
        .animate-ring-2 { animation: ring-pulse 2.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite 0.8s; }
        .animate-ring-3 { animation: ring-pulse 2.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite 1.6s; }

        .ease-spring {
            transition-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Layout & Card Container from 25 */
        #app {
            position: relative;
            width: 100%;
            max-width: 960px;
            height: 90vh;
            min-height: 720px;
            max-height: 880px;
            overflow: hidden;
            background: #FFFFFF;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
            border-radius: 40px;
            display: flex;
            flex-direction: column;
        }

        /* Top HUD Bar */
        .top-hud {
            padding: 32px 40px 10px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 30;
            position: relative;
        }

        .brand-title {
            font-size: 26px;
            font-weight: 800;
            color: #1A1A1A;
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        .brand-subtitle {
            font-size: 13px;
            font-weight: 500;
            color: #888888;
            margin-top: 4px;
        }

        .metrics-pills {
            display: flex;
            gap: 10px;
        }

        .metric-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            background: #F5F5F5;
            font-size: 12px;
            font-weight: 600;
            color: #1A1A1A;
            font-family: 'JetBrains Mono', monospace;
        }

        .status-dot-green {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4ADE80;
            box-shadow: 0 0 8px #4ADE80;
        }

        /* Interactive Caret Text Bar */
        .input-bar-container {
            padding: 0 40px;
            z-index: 30;
            margin-top: 10px;
        }

        .input-bar {
            background: #F8F7FC;
            border: 2px solid #EBE7F5;
            border-radius: 24px;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            transition: all 0.25s ease;
        }

        .input-bar:focus-within {
            border-color: #B4A5FA;
            background: #FFFFFF;
            box-shadow: 0 8px 24px rgba(180, 165, 250, 0.25);
        }

        .interactive-input {
            flex: 1;
            border: none;
            background: transparent;
            font-family: 'JetBrains Mono', monospace;
            font-size: 15px;
            font-weight: 600;
            color: #1A1A1A;
            outline: none;
        }

        .hotkey-badge {
            background: #1A1A1A;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        /* 3D Isometric Dispatch Stage */
        .stage-center {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        .iso-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            perspective: 1400px;
        }

        .garden-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            padding: 16px;
        }

        /* Macro Tile inside 3D grid */
        .macro-tile {
            background: rgba(255, 255, 255, 0.85);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            padding: 4px;
            text-align: center;
        }

        .macro-tile:hover, .macro-tile.active {
            background: #FFFFFF;
            transform: translateZ(24px) scale(1.12);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
            z-index: 50;
        }

        .tile-icon {
            font-size: 22px;
            margin-bottom: 2px;
        }

        .tile-name {
            font-size: 9px;
            font-weight: 700;
            color: #1A1A1A;
            line-height: 1;
        }

        /* Bottom Action Trigger Bar */
        .bottom-action-bar {
            padding: 10px 40px 32px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 30;
            position: relative;
            gap: 10px;
        }

        /* Trigger Button directly from 25 */
        .btn-trigger {
            position: relative;
            width: 72px;
            height: 72px;
            border-radius: 26px;
            background: #1A1A1A;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.16);
            cursor: pointer;
            border: none;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            outline: none;
        }

        .btn-trigger:hover {
            transform: scale(1.06);
            background: #000000;
        }

        .btn-trigger:active {
            transform: scale(0.95);
        }

        .trigger-subtext {
            font-size: 12px;
            color: #888888;
            font-weight: 500;
        }

        /* Dynamic Pop-up Decision Card (Top-3 Intent Card) */
        .decision-popup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.92);
            width: 340px;
            background: #FFFFFF;
            border-radius: 28px;
            padding: 22px;
            box-shadow: 0 30px 60px rgba(180, 165, 250, 0.35), 0 0 0 1px #EBE7F5;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .decision-popup.active {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        .popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid #F3F0FA;
            font-size: 11px;
            color: #888888;
            font-weight: 600;
        }

        .popup-tag {
            background: #F3F0FA;
            color: #7C3AED;
            padding: 3px 8px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 700;
        }

        .popup-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 14px;
        }

        .action-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: #F8F7FC;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.18s ease;
            border: 1px solid transparent;
        }

        .action-card:hover {
            background: #FFFFFF;
            border-color: #B4A5FA;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(180, 165, 250, 0.2);
        }

        .action-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .keycap-num {
            width: 26px;
            height: 26px;
            border-radius: 8px;
            background: #1A1A1A;
            color: white;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .action-title {
            font-size: 13px;
            font-weight: 700;
            color: #1A1A1A;
        }

        .action-desc {
            font-size: 10px;
            color: #888888;
            font-family: 'JetBrains Mono', monospace;
        }

        .action-prob {
            font-size: 12px;
            font-weight: 700;
            color: #10B981;
            font-family: 'JetBrains Mono', monospace;
        }

        .popup-footer {
            margin-top: 14px;
            padding-top: 10px;
            border-top: 1px solid #F3F0FA;
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #AAA;
            font-family: 'JetBrains Mono', monospace;
        }

        /* Screen 2: Repurposed Screen Record from 25 as Mobile Relay & Detail Drawer */
        #screen-detail {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s ease;
            background: #FFFFFF;
            z-index: 50;
            transform: translateY(16px);
            padding: 32px 40px;
        }

        #screen-detail.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .detail-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-cancel {
            width: 48px;
            height: 48px;
            border-radius: 18px;
            background: #F5F5F5;
            color: #1A1A1A;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-cancel:hover {
            background: #EAEAEA;
            transform: scale(1.05);
        }

        .detail-center {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 16px;
        }

        .detail-heading {
            font-size: 28px;
            font-weight: 800;
            color: #1A1A1A;
            line-height: 1.2;
        }

        .qr-ring-stage {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 220px;
            height: 220px;
            margin: 10px 0;
        }

        .qr-canvas-card {
            position: relative;
            z-index: 10;
            padding: 16px;
            background: #FFFFFF;
            border-radius: 28px;
            box-shadow: 0 16px 36px rgba(180, 165, 250, 0.35);
            border: 2px solid #EBE7F5;
        }

        .payload-box {
            background: #F5F5F5;
            padding: 10px 20px;
            border-radius: 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: #1A1A1A;
            max-width: 400px;
            word-break: break-all;
        }

        /* In-place replace flash animation */
        @keyframes greenFlash {
            0% { background: #BBF7D0; }
            100% { background: #F8F7FC; }
        }
        .flash-active {
            animation: greenFlash 0.8s ease-out;
        }
    </style>
</head>
<body>

    <div id="app">

        <!-- Screen 1: 3D Isometric Desktop Dispatcher (Home) -->
        <div id="screen-home" style="display: flex; flex-direction: column; height: 100%;">
            
            <!-- Top HUD Bar -->
            <div class="top-hud">
                <div>
                    <div class="brand-title">SmartKey.Jev</div>
                    <div class="brand-subtitle">Desktop Instant Intent Engine // 3D Core</div>
                </div>

                <div class="metrics-pills">
                    <div class="metric-chip">
                        <span class="status-dot-green"></span>
                        <span>&lt; 1.2ms</span>
                    </div>
                    <div class="metric-chip">
                        <span>99.4% Converged</span>
                    </div>
                    <div class="metric-chip">
                        <span>Win+V Safe</span>
                    </div>
                </div>
            </div>

            <!-- Simulated Caret Selection Input Bar -->
            <div class="input-bar-container">
                <div class="input-bar" id="input-bar-box">
                    <div style="display: flex; align-items: center; gap: 10px; flex: 1;">
                        <span class="material-symbols-rounded" style="color: #7C3AED; font-size: 20px;">terminal</span>
                        <input type="text" id="active-text-input" class="interactive-input" value="1024 * 768 / 2" spellcheck="false" placeholder="输入任意文本、算式或色值...">
                    </div>
                    <div class="hotkey-badge" onclick="triggerAltAction()">
                        <span>Double-Tap Alt</span>
                        <span class="material-symbols-rounded" style="font-size: 16px;">bolt</span>
                    </div>
                </div>
            </div>

            <!-- Center Stage: 3D Isometric Dispatch Platform from 25 -->
            <div class="stage-center">
                <div class="iso-wrapper preserve-3d">
                    <div class="preserve-3d animate-float-platform flex items-center justify-center" style="width: 100%; height: 100%;">
                        <div class="w-[280px] h-[280px] iso-platform preserve-3d" style="width: 280px; height: 280px;">
                            <div class="garden-grid preserve-3d" id="iso-grid">
                                <!-- 16 3D Macro Slots populated by JS -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Floating Top-3 Decision Overlay Card -->
                <div class="decision-popup" id="decision-popup">
                    <div class="popup-header">
                        <span class="popup-tag" id="popup-context-tag">CODE.EXE</span>
                        <span id="popup-snippet-text">"1024 * 768 / 2"</span>
                        <span>盲按 1/2/3</span>
                    </div>

                    <div class="popup-actions" id="popup-actions-list">
                        <!-- Top-3 Actions -->
                    </div>

                    <div class="popup-footer">
                        <span>两级分桶启发式置信度</span>
                        <span>按 Esc 关闭</span>
                    </div>
                </div>
            </div>

            <!-- Bottom Trigger Area with Pulsing Rings directly from 25 -->
            <div class="bottom-action-bar">
                <div style="position: relative; display: flex; align-items: center; justify-content: center;">
                    <!-- Concentric Rings from 25 -->
                    <div class="absolute w-24 h-24 rounded-full bg-[#B4A5FA]/20 animate-ring-1 pointer-events-none" style="position: absolute; width: 80px; height: 80px; border-radius: 50%;"></div>
                    <div class="absolute w-24 h-24 rounded-full bg-[#B4A5FA]/40 animate-ring-2 pointer-events-none" style="position: absolute; width: 80px; height: 80px; border-radius: 50%;"></div>
                    <div class="absolute w-24 h-24 rounded-full bg-[#B4A5FA]/60 animate-ring-3 pointer-events-none" style="position: absolute; width: 80px; height: 80px; border-radius: 50%;"></div>

                    <!-- Trigger Button from 25 -->
                    <button class="btn-trigger" id="btn-main-trigger" onclick="triggerAltAction()">
                        <span class="material-symbols-rounded" style="font-size: 32px;">bolt</span>
                    </button>
                </div>
                <div class="trigger-subtext">敲击键盘物理两次 Alt 或盲按数字 1/2/3 瞬发</div>
            </div>

        </div>

        <!-- Screen 2: Repurposed Screen-Record from 25 for Mobile Relay & Detail View -->
        <div id="screen-detail">
            <div class="detail-top">
                <button class="btn-cancel" onclick="closeDetailScreen()">
                    <span class="material-symbols-rounded" style="font-size: 24px;">close</span>
                </button>
                <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; color: #7C3AED;">
                    CATEGORY B // DRAWER MODE
                </div>
            </div>

            <div class="detail-center">
                <h2 class="detail-heading" id="detail-heading">
                    Mobile Relay<br>手机跨屏实时接力
                </h2>

                <div class="qr-ring-stage">
                    <div class="absolute w-28 h-28 rounded-full bg-[#FFBE76]/20 animate-ring-1 pointer-events-none" style="position: absolute; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,190,118,0.25);"></div>
                    <div class="absolute w-28 h-28 rounded-full bg-[#FFBE76]/40 animate-ring-2 pointer-events-none" style="position: absolute; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,190,118,0.4);"></div>

                    <div class="qr-canvas-card">
                        <canvas id="qr-canvas" width="150" height="150"></canvas>
                    </div>
                </div>

                <div class="payload-box" id="detail-payload-text">
                    1024 * 768 / 2
                </div>

                <button class="btn-trigger" style="width: auto; height: 48px; border-radius: 18px; padding: 0 28px; font-size: 13px; font-weight: 600; gap: 8px;" onclick="copyPayload()" id="copy-payload-btn">
                    <span class="material-symbols-rounded" style="font-size: 18px;">content_copy</span>
                    <span>一键复制内容</span>
                </button>
            </div>
        </div>

    </div>

    <!-- Interactive Logic Script -->
    <script>
        // 16 Real SmartKey Macro Slots for the 3D Isometric Platform
        const MACRO_SLOTS = [
            { id: 'calc', icon: '🧮', name: '求值', preset: '1024 * 768 / 2' },
            { id: 'color', icon: '🎨', name: '色值', preset: '#4A90E2' },
            { id: 'cmd', icon: '💻', name: '命令', preset: '回退上一个commit' },
            { id: 'naming', icon: '🔤', name: '命名', preset: 'user_profile_data' },
            { id: 'error', icon: '🛠️', name: '修复', preset: "KeyError: 'auth_token'" },
            { id: 'qr', icon: '📱', name: '扫码', preset: 'https://github.com/jjy0230/SmartKey-Jev' },
            { id: 'pin', icon: '📌', name: '便签', preset: '架构设计关键参数' },
            { id: 'json', icon: '🧩', name: 'JSON', preset: '{"status":"ok","code":200}' },
            { id: 'url', icon: '🔗', name: 'URL', preset: 'https://github.com?tab=overview' },
            { id: 'hash', icon: '🔑', name: 'Hash', preset: 'AdminPassword123' },
            { id: 'table', icon: '📊', name: '表格', preset: 'Item\tPrice\tQty\nApple\t5\t10' },
            { id: 'dict', icon: '📖', name: '查词', preset: 'epistemology' },
            { id: 'trans', icon: '🌐', name: '翻译', preset: 'instant intent predictor' },
            { id: 'cron', icon: '⏰', name: '定时', preset: '每天早上9点提醒' },
            { id: 'clean', icon: '🧹', name: '清洗', preset: '   大量冗余空白行   ' },
            { id: 'spot', icon: '⚡', name: '启动', preset: '' }
        ];

        // Scenario Decision Matrix for Top-3 Prediction
        const SCENARIO_PREDICTIONS = {
            calc: [
                { key: 1, title: '就地求值', desc: '直接替换为 393216', prob: '99.4%', mode: 'A', res: '393216' },
                { key: 2, title: '生成二维码', desc: '手机扫码跨屏接力', prob: '0.4%', mode: 'B', res: '1024 * 768 / 2' },
                { key: 3, title: '公式检索', desc: '在浏览器搜索算式', prob: '0.2%', mode: 'C', res: 'https://www.google.com/search?q=1024*768/2' }
            ],
            color: [
                { key: 1, title: '转换 RGB 色值', desc: 'rgb(74, 144, 226)', prob: '98.6%', mode: 'A', res: 'rgb(74, 144, 226)' },
                { key: 2, title: '转换 HSL 色值', desc: 'hsl(212, 72%, 59%)', prob: '1.1%', mode: 'A', res: 'hsl(212, 72%, 59%)' },
                { key: 3, title: '手机读取色卡', desc: '扫码存入手机调色板', prob: '0.3%', mode: 'B', res: '#4A90E2' }
            ],
            cmd: [
                { key: 1, title: '转标准 Git 命令', desc: 'git reset --soft HEAD~1', prob: '98.9%', mode: 'A', res: 'git reset --soft HEAD~1' },
                { key: 2, title: '查询 Git 文档', desc: '官方 reset 参数用法', prob: '0.8%', mode: 'C', res: 'https://git-scm.com/docs/git-reset' },
                { key: 3, title: '手机备忘', desc: '扫码转存手机', prob: '0.3%', mode: 'B', res: 'git reset --soft HEAD~1' }
            ],
            naming: [
                { key: 1, title: '转 camelCase', desc: 'userProfileData', prob: '96.8%', mode: 'A', res: 'userProfileData' },
                { key: 2, title: '转 PascalCase', desc: 'UserProfileData', prob: '2.4%', mode: 'A', res: 'UserProfileData' },
                { key: 3, title: '查词与释义', desc: '查询 profile 单词定义', prob: '0.8%', mode: 'B', res: 'Profile: 用户画像与配置文件' }
            ],
            error: [
                { key: 1, title: '注入防御捕获', desc: 'try-except 容错包装', prob: '99.8%', mode: 'A', res: 'try:\n    auth = data.get(\'auth_token\')\nexcept KeyError:\n    auth = None' },
                { key: 2, title: '搜索报错堆栈', desc: 'StackOverflow 检索', prob: '0.1%', mode: 'C', res: 'https://stackoverflow.com/search?q=KeyError:auth_token' },
                { key: 3, title: '扫码发送群聊', desc: '手机发送至排障群', prob: '0.1%', mode: 'B', res: 'KeyError: auth_token' }
            ]
        };

        let currentActiveKey = 'calc';
        let isPopupOpen = false;

        document.addEventListener('DOMContentLoaded', () => {
            init3DGrid();
            loadMacroScenario('calc');
        });

        // Initialize 16 3D Isometric Slots
        function init3DGrid() {
            const grid = document.getElementById('iso-grid');
            grid.innerHTML = '';

            MACRO_SLOTS.forEach((slot, idx) => {
                const tile = document.createElement('div');
                tile.className = 'macro-tile preserve-3d';
                tile.id = `slot-${slot.id}`;
                tile.onclick = () => loadMacroScenario(slot.id);

                tile.innerHTML = `
                    <div class="iso-upright">
                        <div class="tile-icon">${slot.icon}</div>
                        <div class="tile-name">${slot.name}</div>
                    </div>
                `;
                grid.appendChild(tile);
            });
        }

        function loadMacroScenario(id) {
            currentActiveKey = id;
            const slot = MACRO_SLOTS.find(s => s.id === id) || MACRO_SLOTS[0];
            
            document.getElementById('active-text-input').value = slot.preset;
            
            // Highlight active 3D tile
            document.querySelectorAll('.macro-tile').forEach(t => t.classList.remove('active'));
            const activeTile = document.getElementById(`slot-${id}`);
            if (activeTile) activeTile.classList.add('active');

            closePopup();
        }

        // Trigger Alt Action (Double Alt)
        function triggerAltAction() {
            const input = document.getElementById('active-text-input');
            const text = input.value.trim();
            const popup = document.getElementById('decision-popup');

            // Detect prediction profile
            let predList = SCENARIO_PREDICTIONS[currentActiveKey] || SCENARIO_PREDICTIONS.calc;
            
            document.getElementById('popup-context-tag').textContent = currentActiveKey.toUpperCase();
            document.getElementById('popup-snippet-text').textContent = text ? `"${text.substring(0, 16)}${text.length > 16 ? '...' : ''}"` : '"(空选区)"';

            const listContainer = document.getElementById('popup-actions-list');
            listContainer.innerHTML = '';

            predList.forEach(act => {
                const card = document.createElement('div');
                card.className = 'action-card';
                card.onclick = (e) => {
                    e.stopPropagation();
                    executeAction(act);
                };

                card.innerHTML = `
                    <div class="action-left">
                        <div class="keycap-num">${act.key}</div>
                        <div>
                            <div class="action-title">${act.title}</div>
                            <div class="action-desc">${act.desc}</div>
                        </div>
                    </div>
                    <div class="action-prob">${act.prob}</div>
                `;
                listContainer.appendChild(card);
            });

            popup.classList.add('active');
            isPopupOpen = true;
        }

        function executeAction(act) {
            closePopup();

            if (act.mode === 'A') {
                // In-Place Replace Mode
                const input = document.getElementById('active-text-input');
                input.value = act.res;
                const bar = document.getElementById('input-bar-box');
                bar.classList.add('flash-active');
                setTimeout(() => bar.classList.remove('flash-active'), 800);
            } else if (act.mode === 'B') {
                // Category B: Screen 2 Slide-in
                openDetailScreen(act);
            } else {
                // Outsource
                window.open(act.res, '_blank');
            }
        }

        function openDetailScreen(act) {
            const screenDetail = document.getElementById('screen-detail');
            screenDetail.classList.add('active');
            document.getElementById('detail-heading').innerHTML = `${act.title}<br><span style="font-size: 15px; font-weight: 500; color: #888;">跨屏实时同步</span>`;
            document.getElementById('detail-payload-text').textContent = act.res;

            const canvas = document.getElementById('qr-canvas');
            if (typeof QRCode !== 'undefined') {
                QRCode.toCanvas(canvas, act.res, {
                    width: 150,
                    margin: 1,
                    color: { dark: '#1A1A1A', light: '#FFFFFF' }
                });
            }
        }

        function closeDetailScreen() {
            document.getElementById('screen-detail').classList.remove('active');
        }

        function closePopup() {
            document.getElementById('decision-popup').classList.remove('active');
            isPopupOpen = false;
        }

        function copyPayload() {
            const txt = document.getElementById('detail-payload-text').textContent;
            navigator.clipboard.writeText(txt).then(() => {
                const btn = document.getElementById('copy-payload-btn');
                btn.innerHTML = `<span class="material-symbols-rounded" style="font-size: 18px;">check</span><span>已复制</span>`;
                setTimeout(() => {
                    btn.innerHTML = `<span class="material-symbols-rounded" style="font-size: 18px;">content_copy</span><span>一键复制内容</span>`;
                }, 2000);
            });
        }

        // Global Physical Keyboard Hooks
        let lastAltTime = 0;
        window.addEventListener('keydown', (e) => {
            // Physical Alt Double Tap
            if (e.key === 'Alt') {
                const now = Date.now();
                if (now - lastAltTime < 380) {
                    e.preventDefault();
                    if (isPopupOpen) {
                        closePopup();
                    } else {
                        triggerAltAction();
                    }
                    lastAltTime = 0;
                    return;
                }
                lastAltTime = now;
            }

            // Esc key
            if (e.key === 'Escape') {
                closePopup();
                closeDetailScreen();
            }

            // Blind typing 1, 2, 3
            if (isPopupOpen && ['1', '2', '3'].includes(e.key)) {
                e.preventDefault();
                const idx = parseInt(e.key) - 1;
                const predList = SCENARIO_PREDICTIONS[currentActiveKey] || SCENARIO_PREDICTIONS.calc;
                if (predList[idx]) {
                    executeAction(predList[idx]);
                }
            }
        });

        // Close on outside click
        document.addEventListener('click', (e) => {
            if (!e.target.closest('#decision-popup') && !e.target.closest('#btn-main-trigger') && !e.target.closest('.hotkey-badge') && !e.target.closest('#input-bar-box')) {
                closePopup();
            }
        });
    </script>
</body>
</html>
